<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - موظفة استقبال مكتبة الهندسة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="avatar-glow"></div>
            <h1>ARIA</h1>
            <p>مساعدتك الذكية في مكتبة كلية الهندسة</p>
        </header>

        <main>
            <div id="chat-container" class="chat-container">
                <div class="message aria-message">
                    أهلاً بك في مكتبة كلية الهندسة! أنا آريا، كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>

            <div class="controls">
                <button id="mic-btn" class="mic-btn" title="تحدث مع آريا">
                    <svg viewBox="0 0 24 24" width="28" height="28">
                        <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <span id="status-text" class="status-text">اضغط للتحدث</span>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
